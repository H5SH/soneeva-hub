[project]
name = "karbon-hub"
version = "0.1.0"
description = "Central auth, billing, provisioning and numbers for Soneeva and the apps it bills"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "stripe>=12.0.0",
    "pyjwt[crypto]>=2.9.0",
    # Capped below 47: that release dropped the macOS universal2 wheel, so on an Intel Mac
    # anything newer compiles from Rust + OpenSSL. 46.x is current and has Ed25519.
    "cryptography>=44,<47",
    "python-dotenv>=1.0.0",
    "firebase-admin>=6.5.0",
    "httpx>=0.28.1",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-run>=0.16.2",
    "jinja2>=3.1.6",
    "joserfc>=1.7.5",
    "google-cloud-secret-manager>=2.31.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pyright>=1.1.380",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
