[project]
name = "payment-service"
version = "0.1.0"
description = "Central Stripe billing service for BigCommerce apps"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "stripe>=12.0.0",
    "pyjwt>=2.9.0",
    "firebase-admin>=6.5.0",
    "jinja2>=3.1.4",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
