<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Soneeva</title>
{% include "_icon.html" %}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#fbfaf7, #0e0e0f);
    --ink: light-dark(#0b0b0c, #f3f1ea);
    --muted: light-dark(#5c5a52, #a9a69b);
    --line: light-dark(#d9d5c7, #2b2a26);
    --action: light-dark(#0f766e, #1fa898);
    --on-action: light-dark(#fbfaf7, #0b0b0c);
    --mark-mid: light-dark(#22b3a1, #2cc5b1);
    --mark-deep: light-dark(#0f766e, #1fa898);
    --mark-bar: light-dark(#22b3a1, #3fd5c2);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    height: 100dvh; overflow: hidden; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--ink); font: 16px/1.5 "Instrument Sans", system-ui, sans-serif;
  }
  main { display: grid; justify-items: center; gap: 20px; text-align: center; }
  h1 { margin: 0; font: 400 clamp(40px, 7vw, 72px)/1 "Instrument Serif", Georgia, serif; }
  h1 em { color: var(--action); }
  p { margin: 0; color: var(--muted); max-width: 30em; }
  a.button {
    display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 22px;
    border-radius: 10px; background: var(--action); color: var(--on-action); font-weight: 600; text-decoration: none;
  }
  a.button:hover { background: color-mix(in oklab, var(--action) 86%, #000); }
  a.button:focus-visible { outline: 3px solid #dad383; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg viewBox="16 9 68 82" width="53" height="64" role="img" aria-label="Soneeva">
    <defs>
      <linearGradient id="mark-ring" x1=".2" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#dad383"/><stop offset=".55" style="stop-color:var(--mark-mid)"/><stop offset="1" style="stop-color:var(--mark-deep)"/></linearGradient>
      <linearGradient id="mark-bars" gradientUnits="userSpaceOnUse" x1="0" y1="26" x2="0" y2="60"><stop offset="0" style="stop-color:var(--mark-bar)"/><stop offset="1" style="stop-color:var(--mark-deep)"/></linearGradient>
    </defs>
    <path d="M44.6 73.5A31 31 0 1 1 80.6 48Q77 72 52 88Q49 81 44.6 73.5Z" fill="none" stroke="url(#mark-ring)" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M37 38v10M43.5 32v22M50 26v34M56.5 34v18M63 39v8" stroke="url(#mark-bars)" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <h1>Call smart. <em>Call Soneeva.</em></h1>
  {% if staff %}
    <p>You're signed in with access to internal tools.</p>
    <a class="button" href="/recover">Open key recovery</a>
  {% else %}
    <p>The voice agent that answers your business phones in every language.</p>
    <a class="button" href="{{ site }}">Visit soneeva.com</a>
  {% endif %}
</main>
</body>
</html>
